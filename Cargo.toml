[package]
name = "mcpprobe"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Reliability harness for Model Context Protocol servers: pass@k, pass^k, and a degenerate-call audit."
repository = "https://github.com/Intermountainh8ter/mcpprobe"
keywords = ["mcp", "reliability", "testing", "benchmark"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "process", "time", "sync"] }
anyhow = "1"
rand = "0.8"
rand_pcg = "0.3"
regex = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "mcpprobe"
path = "src/main.rs"

[lib]
name = "mcpprobe"
path = "src/lib.rs"

[workspace]
